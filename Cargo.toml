[package]
name = "pairpack"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Store a string column of a parquet shard as character edits of another string column, and rebuild it byte for byte."

[lib]
name = "pairpack"
path = "src/lib.rs"

[[bin]]
name = "pairpack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow-array = "56"
arrow-buffer = "56"
arrow-data = "60"
arrow-schema = "56"
clap = { version = "4", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
parquet = { version = "56", features = ["arrow"] }
rayon = "1.11"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
