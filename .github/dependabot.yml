version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # arrow and parquet pin each other's exact version, so every update of them arrives together, majors too.
      arrow:
        patterns: ['arrow*', 'parquet']
      production:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
